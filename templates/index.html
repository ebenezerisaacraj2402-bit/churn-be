<!DOCTYPE html>
<html>
<head>
    <title>Customer Churn Prediction</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 40px; }
        form { background: white; padding: 20px; width: 350px; margin: auto; }
        input, select, button {
            width: 100%; padding: 8px; margin: 8px 0;
        }
        button { background: #007bff; color: white; border: none; }
        h2 { text-align: center; }
    </style>
</head>
<body>

<form action="/predict" method="post">
    <h2>Customer Churn Prediction</h2>

    <select name="gender">
        <option value="1">Male</option>
        <option value="0">Female</option>
    </select>

    <select name="senior">
        <option value="0">Not Senior Citizen</option>
        <option value="1">Senior Citizen</option>
    </select>

    <input type="number" name="tenure" placeholder="Tenure (months)" required>
    <input type="number" step="0.01" name="monthly" placeholder="Monthly Charges" required>
    <input type="number" step="0.01" name="total" placeholder="Total Charges" required>

    <button type="submit">Predict</button>

    <h3 style="text-align:center;">{{ prediction }}</h3>
</form>

</body>
</html>
